# Server images -> ghcr.io/drtilp/voxa-api (CPU) and voxa-api-gpu (CUDA), each :latest and :<sha>.
# Manual only (Actions tab -> Run workflow): the images are several GB because the models are baked in.
# Pushed with the workflow's own GITHUB_TOKEN, no secret needed. A new package is private: switch it to Public
# in the package settings if other people should pull it.
name: API image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: voxa-api
            context: .
            file: src/Voxa.Api/Dockerfile
            target: cpu
            gpu: 'false'
          - name: voxa-api-gpu
            context: .
            file: src/Voxa.Api/Dockerfile
            target: gpu
            gpu: 'true'
    steps:
      - uses: actions/checkout@v4

      # The images are 6-12 GB unpacked (models, CUDA), the runner has ~14 GB free: drop preinstalled SDKs we don't use.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: VOXA_GPU=${{ matrix.gpu }}
          push: true
          # Links the package to this repository (shown under Packages on the repo page).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          # Layer cache in the registry: the 3 GB model layer is downloaded from Hugging Face only once.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache,mode=max
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false # no build-record artifact (counts against Actions storage)
